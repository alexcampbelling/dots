<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  99-cjk.conf — CJK fallback for JetBrainsMono Nerd Font
  Primary: JetBrainsMono Nerd Font (Latin, coding, icons)
  CJK fallback: Adobe Source Han Sans CN (Simplified Chinese)
-->
<fontconfig>

  <!-- Prefer JetBrainsMono for monospace; fall back to Source Han Sans CN -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrainsMonoNL Nerd Font</family>
      <family>Source Han Sans CN</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>

  <!-- Prefer Source Han Sans CN for sans-serif CJK -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Source Han Sans CN</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>

</fontconfig>
