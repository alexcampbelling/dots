# Core Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Toolkit Backends
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# App fixes (Firefox and Electron applications)
# Firefox is forced to XWayland: its native Wayland backend double-scrolls with
# high-resolution wheels (G502 X + kernel 6.19+). Verified via wev (clean single
# event per notch: value=15, value120=120) + XWayland test. Knobs that do NOT
# fix it: emulate_discrete_scroll, general.smoothScroll,
# mousewheel.default.delta_multiplier_y, apz.paint_skipping.enabled, debug:vfr.
# Firefox 121+ defaults to Wayland, so only MOZ_ENABLE_WAYLAND=0 opts out.

# Laptop don't want this line, desktop for now want this line so we launch in Xwayland

# TODO: split out this per machine in dots with lua. 0 for desktop, n/a laptop

env = MOZ_ENABLE_WAYLAND,0
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = BROWSER,firefox

# UI Consistency
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
