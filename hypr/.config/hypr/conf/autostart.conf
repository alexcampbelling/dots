# Polkit agent for GUI auth (IDE saves, pkexec, etc.)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper: hyprpaper + Waypaper restore
exec-once = $HOME/.config/hypr/scripts/wallpaper-autostart.sh

# Vicinae launcher daemon (Super+Space toggles via $menu in keybinds.conf)
exec-once = vicinae server

# Waybar
exec-once = waybar
exec-once = $HOME/.config/hypr/scripts/waybar-restart-on-resume.sh

# Hypridle — auto-lock + suspend
exec-once = hypridle
