# Ensure some quickly used windows start floating
# pavucontrol: Wayland app_id is org.pulseaudio.pavucontrol (not "pavucontrol")
windowrule = match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol)$, float 1, size (monitor_w*0.5) (monitor_h*0.7)
windowrule = match:class ^(blueman-manager)$, float 1, size (monitor_w*0.5) (monitor_h*0.5)

# RuneLite: float only the launcher (match:title uses initial title for static rules like float).
# The game client has a different title/class — avoid rules that match all java/xwayland windows.
windowrule = float on, match:title ^RuneLite Launcher$
windowrule = center on, match:title ^RuneLite Launcher$
windowrule = size 600 400, match:title ^RuneLite Launcher$

# Vesktop: float secondary windows; keep the main client tiled.
# Hyprland uses RE2 — no (?!…) lookahead. Use negative: so the rule applies when title does NOT match.
# Adjust ^Discord$ if your main window’s initial title differs (check: hyprctl clients).
windowrule = float on, center on, match:class ^vesktop$, match:title negative:^Discord$

# Connection and game-launcher utility windows are better as centered dialogs.
windowrule = match:class ^nm-connection-editor$, float 1, center 1, size (monitor_w*0.5) (monitor_h*0.5)
windowrule = match:class ^(Bolt|bolt-launcher)$, float 1, center 1, size (monitor_w*0.5) (monitor_h*0.7)

# Default windowrules (moved from hyprland.conf)

windowrule {
    # Ignore maximize requests from all apps
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
