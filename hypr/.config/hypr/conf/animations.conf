# Animations — single source of truth (sourced at end of hyprland.conf)
# Format:  animation = NAME, ONOFF, SPEED, CURVE, [STYLE]
#   ONOFF:  0 = off, 1 = on
#   SPEED:  higher = faster (1–10 typical)
#   CURVE:  bezier name defined above
#   STYLE:  slide | slidevert | slidefade | slidefadevert | popin | popin % |
#           fade | once (borderangle only) | plain (border only)

animations {
    enabled = true

    # Bezier curves:  NAME | P0(x,y) | P1(x,y)

    bezier = wind,          0.05, 0.9,  0.1,  1.0    # decelerate, settle — no overshoot
    bezier = winIn,         0.1,  1.1,  0.1,  1.1    # aggressive overshoot (open)
    bezier = winOut,        0.3,  -0.3, 0,    1      # back-swing (close)
    bezier = liner,         1,    1,    1,    1       # perfectly linear (no easing)

    bezier = easeOutQuint,  0.23, 1,    0.32, 1      # fast start, gentle settle
    bezier = easeInOutCubic,0.65, 0.05, 0.36, 1      # smooth in + out
    bezier = linear,        0,    0,    1,    1       # uniform speed
    bezier = almostLinear,  0.5,  0.5,  0.75, 1      # near-linear, soft tail
    bezier = quick,         0.15, 0,    0.1,  1       # instant kick, fast settle

    # Global — scales speed of all other animations (lower = slower)
    animation = global,         1,  10,   default

    # Border — colour transition + chasing-light rotation
    animation = border,         1,  1,    liner
    animation = borderangle,    1,  30,   liner,  once

    # Windows — open(appear) / close(disappear) / move(reposition or resize)
    #   popin N% — starts at N% scale then pops to 100%
    animation = windows,        1,  6,    wind,    slide
    animation = windowsIn,      1,  6,    winIn,   slide
    animation = windowsOut,     1,  5,    winOut,  slide
    animation = windowsMove,    1,  5,    wind,    slide

    # Fade — crossfade (fadeIn/Out = slow reveal/vanish; fade = generic)
    animation = fadeIn,         1,  1.73, almostLinear
    animation = fadeOut,        1,  1.46, almostLinear
    animation = fade,           1,  3.03, quick

    # Layers — overlay panels (rofi, wofi, launcher, etc.)
    animation = layers,         1,  3.81, easeOutQuint
    animation = layersIn,       1,  4,    easeOutQuint,  fade
    animation = layersOut,      1,  1.5,  linear,        fade

    # Fade-layers — floating / modal sub-layers
    animation = fadeLayersIn,   1,  1.79, almostLinear
    animation = fadeLayersOut,  1,  1.39, almostLinear

    # Workspaces — switching desktops (slide = pan L/R into view)
    #   workspaces    — desktop viewport
    #   workspacesIn  — windows of the new workspace entering
    #   workspacesOut — windows of the old workspace leaving
    animation = workspaces,     1,  2,    wind,   slide
    animation = workspacesIn,   1,  2,    wind,   slide
    animation = workspacesOut,  1,  2,    wind,   slide

    # Special workspaces — scratchpad toggle (very quick fade)
    animation = specialWorkspace,  1, 1.25,  almostLinear, fade

    # Zoom-factor — MOD+scroll zoom
    animation = zoomFactor,     1,  7,    quick

}
