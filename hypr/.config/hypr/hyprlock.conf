# ═══════════════════════════════════════════════════════════════════════════
# Hyprlock — Alex Monochrome Theme
# Styled to match SilentSDDM lock screen layout + monochrome design tokens
# ═══════════════════════════════════════════════════════════════════════════

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Background — light blur so screen behind is still visible ─────────────
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
}

# ── Clock ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 70
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# ── Date — just below clock ───────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# ── Password input — below clock + date ───────────────────────────────────
input-field {
    monitor =
    size = 240, 34
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_text_format = ●
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    hide_input = false

    position = 0, -30
    halign = center
    valign = center

    outer_color = rgba(255, 255, 255, 0.0)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 0.3)
    fail_color = rgba(255, 255, 255, 0.18)

    rounding = 10
}

