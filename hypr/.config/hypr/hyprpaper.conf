# ~/.config/hypr/hyprpaper.conf — optional; hyprpaper reads this on start.
#
# splash — If true, draws the Hyprland splash (logo/branding) on top of the wallpaper.
#          Set false for a clean image only.
splash = false
#
# ipc — If true, hyprctl can control hyprpaper (Waypaper and scripts need this).
#       Only disable in unusual setups; default is true.
ipc = true
#
# First paint at login (before Waypaper --restore). Update paths if your default image changes.
preload = $HOME/wallpaper/pillars.jpg
wallpaper = , $HOME/wallpaper/pillars.jpg
