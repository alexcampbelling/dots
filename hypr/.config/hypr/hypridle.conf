# ═══════════════════════════════════════════════════════════════════════════
# Hypridle — Alex idle management
# ~/.config/hypr/hypridle.conf
# ═══════════════════════════════════════════════════════════════════════════

general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ── Lock after 25 minutes idle ────────────────────────────────────────────
listener {
    timeout = 1500
    on-timeout = hyprlock
    on-resume = hyprctl dispatch dpms on
}

# ── Suspend after 30 minutes idle (5 min after lock) ──────────────────────
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
