# Package-owned theme files stay in /usr/share; this repository owns only this
# drop-in. The SilentSDDM package supplies the theme and virtual keyboard.
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=silent
